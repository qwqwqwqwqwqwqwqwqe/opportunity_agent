services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: opportunity_agent
      POSTGRES_USER: opportunity
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opportunity_dev_only}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opportunity -d opportunity_agent"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:16379:6379"]
  api:
    build:
      context: .
      args:
        APP_EXTRAS: v3,observability
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    command: ["sh", "-c", "python -m alembic upgrade head && exec uvicorn opportunity_agent.v3.app:app --host 0.0.0.0 --port 8000"]
    environment: &app-env
      APP_MODE: applyops
      DATABASE_URL: postgresql+asyncpg://opportunity:${POSTGRES_PASSWORD:-opportunity_dev_only}@postgres:5432/opportunity_agent
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a long random secret}
      AUTO_CREATE_SCHEMA: "0"
      MEMORY_VECTOR_ENABLED: "0"
      OPPORTUNITY_AGENT_DISABLE_DOTENV: "1"
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      MODELSCOPE_API_KEY: ${MODELSCOPE_API_KEY:-}
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_MODEL: ${LLM_MODEL:-}
      STRUCTURED_OUTPUT_MODE: ${STRUCTURED_OUTPUT_MODE:-json_object}
    ports: ["127.0.0.1:8001:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 30
  worker:
    build:
      context: .
      args:
        APP_EXTRAS: v3,observability
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    command: ["python", "-m", "opportunity_agent.v3.worker"]
    environment: *app-env
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres_data:
